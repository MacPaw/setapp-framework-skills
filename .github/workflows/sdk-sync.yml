# Keeps the skills in step with MacPaw/Setapp-framework.
#
# On a new framework tag, a Claude agent:
#   1. diffs the framework's CHANGELOG *and* its .swiftinterface files between
#      the version the skills document and the new tag (release notes miss things),
#   2. updates both SKILL.md files, README, CHANGELOG and plugin version,
#   3. checks every API it documents against the published .swiftinterface files
#      (no compilation — testing the SDK itself belongs to the SDK team),
#   4. opens a PR with a report of what changed and what it could not verify,
#      once .github/sdk-sync/check-sync.sh confirms every version statement moved.
#
# Security: nothing outside the organization can start this workflow.
#   - schedule runs from the default branch only;
#   - workflow_dispatch needs write access to this repo;
#   - repository_dispatch needs a token with write access to this repo;
#   - there is no pull_request / pull_request_target trigger, so forks and PRs
#     never run it, and workflow changes only take effect once merged.
# The key lives in the `sdk-sync` environment, restricted to the `main` branch,
# so only runs from main can read it. A guard fails the run if the key appears
# in the changes or the PR description.
#
# Setup (once):
#   - Settings → Environments → New environment `sdk-sync`:
#       Deployment branches and tags → Selected → `main`;
#       Environment secret ANTHROPIC_API_KEY — a dedicated key with a spend limit.
#   - Settings → Actions → General → Fork pull request workflows:
#       "Require approval for all external contributors".
#
# Optional instant trigger from the framework's release pipeline:
#   repository_dispatch { event_type: "setapp-framework-release", client_payload: { version: "x.y.z" } }
# Otherwise the daily schedule picks new tags up within 24h.

name: SDK sync

on:
  schedule:
    - cron: "17 6 * * *"
  repository_dispatch:
    types: [setapp-framework-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Framework tag to sync to (blank = latest)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sdk-sync
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.v.outputs.current }}
      target: ${{ steps.v.outputs.target }}
      run: ${{ steps.v.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: |
          set -euo pipefail
          current=$(grep -oE 'Latest is \*\*[0-9]+\.[0-9]+\.[0-9]+\*\*' skills/setapp-ai/SKILL.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          latest=$(git ls-remote --tags --refs https://github.com/MacPaw/Setapp-framework.git \
                   | awk -F/ '{print $3}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          target=${REQUESTED:-$latest}
          echo "current=$current target=$target"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "target=$target"   >> "$GITHUB_OUTPUT"

          run=true
          if [ "$(printf '%s\n%s\n' "$current" "$target" | sort -V | tail -1)" = "$current" ]; then
            echo "Skills already document $current — nothing to do."; run=false
          elif gh pr list --state open --json headRefName -q '.[].headRefName' | grep -q '^sdk-sync/'; then
            echo "An sdk-sync PR is already open — skipping until it's merged or closed."; run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  update:
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The Anthropic key is an environment secret, available only to runs from main.
    environment: sdk-sync
    timeout-minutes: 60
    env:
      CURRENT: ${{ needs.detect.outputs.current }}
      TARGET: ${{ needs.detect.outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch both framework versions
        run: |
          git clone --quiet --filter=blob:limit=50m https://github.com/MacPaw/Setapp-framework.git "$RUNNER_TEMP/fw"
          git -C "$RUNNER_TEMP/fw" checkout --quiet "$TARGET"
          git -C "$RUNNER_TEMP/fw" diff "$CURRENT" "$TARGET" -- CHANGELOG.md > "$RUNNER_TEMP/changelog.diff"
          git -C "$RUNNER_TEMP/fw" diff "$CURRENT" "$TARGET" -- \
            'Setapp.xcframework/macos-arm64_x86_64/*/arm64-apple-macos.swiftinterface' \
            'Setapp.xcframework/ios-arm64/*/arm64-apple-ios.swiftinterface' > "$RUNNER_TEMP/interface.diff"
          wc -l "$RUNNER_TEMP"/*.diff

      - name: Run the update agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Update this repository's Setapp skills from Setapp-framework ${{ env.CURRENT }} to ${{ env.TARGET }}.
            Framework checkout at the new tag: ${{ runner.temp }}/fw
            CHANGELOG diff: ${{ runner.temp }}/changelog.diff
            Swift interface diff: ${{ runner.temp }}/interface.diff
            Follow .github/sdk-sync/agent-instructions.md exactly. Write your report to ${{ runner.temp }}/report.md.
          claude_args: >-
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git -C:*),Bash(grep:*),Bash(sed:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*),Bash(bash .github/sdk-sync/check-sync.sh:*)"

      - name: Guard — every version statement and release note updated
        run: |
          git diff --stat
          bash .github/sdk-sync/check-sync.sh "$TARGET" "${{ github.sha }}" "$RUNNER_TEMP/report.md"

      - name: Guard — the key must not leak into the PR
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          [ -n "$KEY" ] || { echo "::error::ANTHROPIC_API_KEY is empty"; exit 1; }
          # Every file in the working tree (tracked or new) and the PR description
          if grep -rIlF --exclude-dir=.git -- "$KEY" . "$RUNNER_TEMP/report.md"; then
            echo "::error::The Anthropic key appears in the files above. Not opening a PR."; exit 1
          fi
          echo "ok    key not present in changes or report"

      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sdk-sync/${{ env.TARGET }}
          title: "Update skills for Setapp-framework ${{ env.TARGET }}"
          commit-message: "Update skills for Setapp-framework ${{ env.TARGET }}"
          body-path: ${{ runner.temp }}/report.md
          labels: sdk-sync
          delete-branch: true
